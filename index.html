<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный Купидон</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background-color: #fff0f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { background-color: #ffffff; border-radius: 24px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(221, 50, 100, 0.1); border: 1px solid #fcddec; text-align: center; }
        .partner-block { background-color: #fff9fc; border: 1px solid #fce7f3; border-radius: 16px; padding: 16px; margin-bottom: 20px; text-align: left; }
        .partner-title { font-size: 13px; font-weight: 800; color: #d1216d; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }
        .input-group { margin-bottom: 12px; }
        input, select { width: 100%; padding: 14px; border: 1px solid #ebd2df; border-radius: 12px; font-size: 16px; color: #333; background-color: #fff; box-sizing: border-box; }
        .btn-calculate { background: linear-gradient(135deg, #e62e7a 0%, #bd1555 100%); color: white; border: none; border-radius: 50px; padding: 16px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 6px 16px rgba(230, 46, 122, 0.3); display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="partner-block">
        <div class="partner-title">Партнер 1</div>
        <div class="input-group"><input type="text" id="name1" placeholder="Имя"></div>
        <div class="input-group"><input type="date" id="date1"></div>
        <div class="input-group">
            <select id="zodiac1">
                <option value="">Выберите знак зодиака</option>
                <option value="Овен">Овен</option><option value="Телец">Телец</option><option value="Близнецы">Близнецы</option><option value="Рак">Рак</option><option value="Лев">Лев</option><option value="Дева">Дева</option><option value="Весы">Весы</option><option value="Скорпион">Скорпион</option><option value="Стрелец">Стрелец</option><option value="Козерог">Козерог</option><option value="Водолей">Водолей</option><option value="Рыбы">Рыбы</option>
            </select>
        </div>
    </div>

    <div class="partner-block">
        <div class="partner-title">Партнер 2</div>
        <div class="input-group"><input type="text" id="name2" placeholder="Имя"></div>
        <div class="input-group"><input type="date" id="date2"></div>
        <div class="input-group">
            <select id="zodiac2">
                <option value="">Выберите знак зодиака</option>
                <option value="Овен">Овен</option><option value="Телец">Телец</option><option value="Близнецы">Близнецы</option><option value="Рак">Рак</option><option value="Лев">Лев</option><option value="Дева">Дева</option><option value="Весы">Весы</option><option value="Скорпион">Скорпион</option><option value="Стрелец">Стрелец</option><option value="Козерог">Козерог</option><option value="Водолей">Водолей</option><option value="Рыбы">Рыбы</option>
            </select>
        </div>
    </div>

    <button class="btn-calculate" onclick="sendInvoiceToBot()">
        ❤️ Рассчитать совместимость
    </button>
</div>

<script>
const predictions = {
    love: [
        "💘 Любовь: В ваших отношениях горит яркое пламя страсти. Ваше притяжение магнетическое.",
        "💘 Любовь: Ваша ментальная связь видна сразу — вы отлично понимаете друг друга по одному взгляду.",
        "💘 Любовь: Взаимное доверие и нежность станут прочным фундаментом для ваших глубоких чувств.",
        "💘 Любовь: Ваш союз наполнен романтикой и вдохновением. Вы раскрываете потенциал друг друга.",
        "💘 Любовь: Между вами царит редкое эмоциональное созвучие. Вы чувствуете настроение партнера."
    ],
    life: [
        "🏡 Быт: В быту вы легко найдете компромиссы, разделяя домашние обязанности поровну.",
        "🏡 Быт: Мелкие бытовые разногласия лишь укрепят ваш союз, так как вы умеете слушать партнера.",
        "🏡 Быт: Ваш общий дом станет уютным пространством, полным гармонии, тепла и комфорта.",
        "🏡 Быт: Вы умеете мотивировать друг друга на финансовые успехи. Быт станет трамплином.",
        "🏡 Быт: Ваш семейный уклад будет динамичным. Вы любите устраивать праздники вместе."
    ],
    future: [
        "✨ Будущее: Впереди вас ждет множество совместных путешествий и больших открытий.",
        "✨ Будущее: Ваши общие кармические цели помогут вам построить стабильное будущее.",
        "✨ Будущее: Вместе вы сможете преодолеть любые жизненные преграды, становясь только ближе.",
        "✨ Будущее: Ваш союз имеет все шансы стать примером идеальной семьи для близких.",
        "✨ Будущее: Будущее готовит вам процветание через общие проекты или семейное дело."
    ]
};

const tg = window.Telegram.WebApp;
tg.ready();

function sendInvoiceToBot() {
    const n1 = document.getElementById('name1').value.trim();
    const n2 = document.getElementById('name2').value.trim();

    if (!n1 || !n2) {
        alert('Пожалуйста, введите имена обоих партнеров! ❤️');
        return;
    }

    const combined = (n1 + n2).toLowerCase();
    let sum = 0;
    for (let i = 0; i < combined.length; i++) {
        sum += combined.charCodeAt(i);
    }
    const idx = sum % 5;

    const text1 = predictions.love[idx];
    const text2 = predictions.life[(idx + 1) % 5];
    const text3 = predictions.future[(idx + 2) % 5];
    const finalReport = `${text1}\n\n${text2}\n\n${text3}`;

    if (tg.initData) {
        const invoiceObj = {
            action: "compatibility_invoice",
            title: `Совместимость: ${n1} + ${n2}`,
            description: "Оплатите 5 Звёзд, чтобы получить полный гороскоп вашей пары прямо в чат! 💘",
            amount: 5, 
            report: finalReport
        };
        tg.sendData(JSON.stringify(invoiceObj));
        tg.close();
    } else {
        alert('Пожалуйста, откройте приложение внутри Telegram-бота, чтобы оплатить расчет Звёздами! ✨');
    }
}
</script>

</body>
</html>
