<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный Купидон</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #fff0f5; 
            background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='60' height='60' viewBox='0 0 60 60'%3E%3Ctext y='30' x='5' font-size='12' opacity='0.15'%3E🌸%3C/text%3E%3Ctext y='55' x='35' font-size='12' opacity='0.15'%3E🌺%3C/text%3E%3C/svg%3E");
            padding: 20px; 
            color: #333; 
            margin: 0;
        }
        .card { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 8px 16px rgba(209,26,91,0.08); border: 1px solid #ffe4e1; }
        .title { color: #c21e56; font-weight: bold; margin-bottom: 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ffb6c1; border-radius: 12px; box-sizing: border-box; font-size: 16px; background-color: #fffafa; color: #333; }
        input:focus { outline: none; border-color: #e6005c; box-shadow: 0 0 5px rgba(230,0,92,0.2); }
        
        .btn-main { background: linear-gradient(135deg, #e6005c, #b8004f); color: white; border: none; width: 100%; padding: 16px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(230,0,92,0.3); transition: transform 0.1s ease; }
        .btn-main:active { transform: scale(0.98); }
        .btn-main:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
        
        .pay-screen { text-align: center; padding: 10px 5px; }
        .pay-status { color: #6a1b9a; font-size: 22px; font-weight: bold; margin-bottom: 15px; }
        .pay-text { color: #666; font-size: 15px; margin-bottom: 25px; line-height: 1.4; }
        .icon-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .icon-box { font-size: 45px; }
        .pay-alert { color: #c21e56; font-weight: bold; font-size: 15px; margin-bottom: 20px; }
        
        /* Экран результатов */
        .result-score { font-size: 48px; font-weight: bold; color: #e6005c; margin: 20px 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .result-text { font-size: 16px; line-height: 1.5; color: #444; text-align: left; background: #fff5f7; padding: 15px; border-radius: 12px; border-left: 4px solid #e6005c; }
    </style>
</head>
<body>

    <h2 id="main-header" style="text-align: center; color: #b8004f; margin-bottom: 25px;">💘 Умный Купидон</h2>

    <!-- ЭКРАН 1: Ввод данных -->
    <div id="form-screen">
        <div class="card">
            <div class="title">🌸 Партнер 1</div>
            <input type="text" id="name1" placeholder="Имя первого партнера" value="Валера">
            <input type="date" id="date1" value="1981-04-21">
        </div>

        <div class="card">
            <div class="title">🌺 Партнер 2</div>
            <input type="text" id="name2" placeholder="Имя второго партнера" value="Юля">
            <input type="date" id="date2" value="1987-03-07">
        </div>

        <button class="btn-main" onclick="showPayScreen()">❤️ Рассчитать совместимость</button>
    </div>

    <!-- ЭКРАН 2: Окно оплаты -->
    <div id="invoice-screen" style="display: none;" class="card pay-screen">
        <div class="pay-status">📊 Анализ готов на 100%!</div>
        <div class="pay-text">Мы нашли скрытые точки пересечения по методу 270 и составили детальный прогноз отношений.</div>
        
        <div class="icon-container">
            <div class="icon-box">🔒</div>
            <div class="icon-box">💝</div>
        </div>
        
        <div class="pay-alert">Чтобы открыть подробный отчет и узнать точный % совместимости:</div>
        <button id="pay-btn" class="btn-main" onclick="sendInvoiceToStars()">⭐ Открыть за 10 Звёзд</button>
    </div>

    <!-- ЭКРАН 3: Результат расчета -->
    <div id="result-screen" style="display: none;" class="card pay-screen">
        <div class="pay-status">🎉 Ваш расчет готов!</div>
        <div id="compatibility-percent" class="result-score">0%</div>
        <div id="compatibility-text" class="result-text">Загрузка прогноза...</div>
        <br>
        <button class="btn-main" onclick="restartApp()">Рассчитать заново</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let p1 = "";
        let p2 = "";

        function showPayScreen() {
            p1 = document.getElementById('name1').value.trim();
            p2 = document.getElementById('name2').value.trim();
            
            if(!p1 || !p2) {
                alert("Пожалуйста, введите оба имени!");
                return;
            }

            document.getElementById('form-screen').style.display = 'none';
            document.getElementById('main-header').style.display = 'none';
            document.getElementById('invoice-screen').style.display = 'block';
        }

        async function sendInvoiceToStars() {
            const date1 = document.getElementById('date1').value;
            const date2 = document.getElementById('date2').value;
            const payBtn = document.getElementById('pay-btn');
            
            payBtn.disabled = true;
            payBtn.innerText = "Создаем счет...";

            try {
                // Отправляем запрос на наш сервер бэкенда
                const response = await fetch('/api/create-invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name1: p1, date1: date1, name2: p2, date2: date2 })
                });

                const data = await response.json();

                if (data && data.invoiceLink) {
                    // Открываем нативное окно оплаты Telegram Stars
                    tg.openInvoice(data.invoiceLink, async function(status) {
                        if (status === 'paid') {
                            loadPrediction(date1, date2);
                        } else if (status === 'cancelled') {
                            alert('Оплата была отменена.');
                            payBtn.disabled = false;
                            payBtn.innerText = "⭐ Открыть за 10 Звёзд";
                        } else {
                            alert('Ошибка при проведении платежа.');
                            payBtn.disabled = false;
                            payBtn.innerText = "⭐ Открыть за 10 Звёзд";
                        }
                    });
                } else {
                    alert('Ошибка: сервер не смог сгенерировать инвойс.');
                    payBtn.disabled = false;
                    payBtn.innerText = "⭐ Открыть за 10 Звёзд";
                }
            } catch (err) {
                alert('Не удалось связаться с сервером. Проверьте статус проекта в Amvera.');
                payBtn.disabled = false;
                payBtn.innerText = "⭐ Открыть за 10 Звёзд";
            }
        }

        async function loadPrediction(date1, date2) {
            try {
                const resultResponse = await fetch(`/api/get-result?name1=${encodeURIComponent(p1)}&date1=${date1}&name2=${encodeURIComponent(p2)}&date2=${date2}`);
                const resultData = await resultResponse.json();
                
                document.getElementById('invoice-screen').style.display = 'none';
                document.getElementById('result-screen').style.display = 'block';
                
                document.getElementById('compatibility-percent').innerText = resultData.percent + "%";
                document.getElementById('compatibility-text').innerText = resultData.prediction;
            } catch (e) {
                alert("Ошибка при получении результата, но оплата прошла. Напишите в поддержку.");
            }
        }

        function restartApp() {
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('form-screen').style.display = 'block';
            document.getElementById('main-header').style.display = 'block';
            document.getElementById('pay-btn').disabled = false;
            document.getElementById('pay-btn').innerText = "⭐ Открыть за 10 Звёзд";
        }
    </script>
</body>
</html>
